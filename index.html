<!DOCTYPE html>
<html lang="en">
<head>
    <title>Job Application Form</title>

    <link rel="stylesheet" href="./style.css"> 
   <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">

        <h1>BIG NANA TECH LIMITED</h1>
        <p class="description">
            Please complete the form below to apply for this position.</p>
        <form>

            <h2 class="section-title">Personal Information
            </h2>

            <div class="row">
                <div class="form-group">
                    <label for="NAME">NAME:</label>
                    <input
                        type="text"
                        id="Name"
                        name="Name"
                        placeholder="Enter your name...."
                        required
                    >
                </div>
                
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="EMAIL">EMAIL:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="aishat@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="PHONE">PHONE NUMBER</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="+234 801....."
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="ADDRESS">ADDRESS</label>
                <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="Enter your address....."
                >
            </div>

            <h2 class="section-title">Job Information</h2>

            <div class="form-group">
                <label for="position">Position Applying For</label>
                <select id="position" name="position" required>
                    <option value="">-- Select a position --</option>
                    <option value="web-developer">Web Developer</option>
                    <option value="designer">UI/UX Designer</option>
                    <option value="accountant">Accountant</option>
                    <option value="marketing">Marketing Manager</option>
                    <option value="customer-service">Customer Service</option>
                    <Option value="human Resources">Human Resources</Option>
                </select>
            </div>

            <div class="form-group">
                <label>Employment Type</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="employment" value="full-time">
                        Full Time
                    </label>

                    <label>
                        <input type="radio" name="employment" value="part-time">
                        Part Time
                    </label>

                    <label>
                        <input type="radio" name="employment" value="contract">
                        Contract
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="salary">Expected Salary</label>
                <input
                    type="number"
                    id="salary"
                    name="salary"
                    placeholder="Enter expected salary"
                >
            </div>

            <h2 class="section-title">Education & Experience</h2>

            <div class="form-group">
                <label for="education">Highest Level of Education</label>

                <select id="education" name="education">
                    <option value="">-- Select education level --</option>
                    <option value="secondary">Secondary School</option>
                    <option value="diploma">Diploma</option>
                    <option value="bachelor">Bachelor's Degree</option>
                    <option value="master">Master's Degree</option>
                    <option value="phd">PhD</option>
                </select>
            </div>

            <div class="form-group">
                <label for="experience">Years of Experience</label>
                <input
                    type="number"
                    id="experience"
                    name="experience"
                    min="0"
                    placeholder="e.g. 5"
                >
            </div>

            <div class="form-group">
                <label for="coverLetter">Cover Letter</label>
                <textarea
                    id="coverLetter"
                    name="coverLetter"
                    placeholder="Tell us why you are suitable for this position..."
                ></textarea>
            </div>

            <h2 class="section-title">Documents</h2>

            <div class="form-group">
                <label for="resume">Upload Resume/CV</label>
                <input
                    type="file"
                    id="resume"
                    name="resume"
                    accept=".pdf,.doc,.docx"
                    required
                >
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <label>
                        <input
                            type="checkbox"
                            name="agreement"
                            required
                        >
                        I confirm that the information provided is accurate.
                    </label>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                Submit Application
            </button>

        </form>
    </div>
<footer>
    <p>&copy; 2026 Big Nana Tech Ltd. All rights reserved.</p>
</footer>
</body>
</html>
